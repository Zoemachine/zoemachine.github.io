      <section class="story-text" aria-label="The story, as text">
        <h2>Act I · The ambush</h2>
        <p><b>Jimmy:</b> Bob. They're buying us out. Term sheet's in my hand.</p>
        <p><b>Bob:</b> Right now? We're in THEIR OFFICE.</p>
        <p><b>Jimmy:</b> Momentum, Bob. Draft the agreement. You have 10 MINUTES.</p>
        <p><i>Bob photographs the term sheet; the phone hands it to the laptop. Local transfer · no cloud.</i></p>
        <p><b>Bob (thinking):</b> Picture taken. Into the laptop.</p>
        <h2>Act II · Open the laptop, pull the plug</h2>
        <p><b>Bob (thinking):</b> I don't trust their Wi-Fi. Going local.</p>
        <p><b>Bob (thinking):</b> Wi-Fi off. Let's go.</p>
        <h2>Act III · Local work, offline</h2>
        <p><b>ZOE:</b> Looks like a term sheet. Let's mark the confidential data first.</p>
        <p><b>ZOE:</b> Marked. Nothing has left this laptop.</p>
        <p><b>ZOE:</b> Found 28 files on this client in your vault.</p>
        <p><b>ZOE:</b> Loaded your firm's buyout template and the conservative seller playbook.</p>
        <p><b>Bob (thinking):</b> Conservative to start. We'll see what they come back with.</p>
        <p><b>ZOE:</b> To draft, I need the frontier AI. I'll clean the data before the Wi-Fi comes back.</p>
        <h2>Act IV · The scrub and the round trip</h2>
        <p><b>ZOE:</b> Data cleaned. Wi-Fi on.</p>
        <p><i>MASKED INFORMATION · NO PII</i></p>
        <p><b>ZOE:</b> Masked term sheet, template, playbook. Draft the agreement.</p>
        <p><b>Frontier AI:</b> Drafting. Who is [ORG_5]? Send what you have.</p>
        <p><b>ZOE:</b> Searching the vault…</p>
        <p><b>ZOE:</b> [ORG_5] is an empty shell. [ORG_6] is the parent. [ORG_6] is not in this deal.</p>
        <p><b>ZOE:</b> Redacting 6 files. Sent.</p>
        <p><b>Frontier AI:</b> Adding [ORG_6]: parent guaranty, indemnification. Draft returning.</p>
        <p><b>Bob (thinking):</b> They left the parent off the hook. Caught it.</p>
        <h2>Act V · Ten minutes are up</h2>
        <p><b>Jimmy:</b> Ten minutes. Tell me you've got something.</p>
        <p><b>Bob:</b> Draft's done. And their shell left the parent off the hook. It's in now.</p>
        <p><b>Jimmy:</b> …How?</p>
        <p><b>Bob:</b> ZOE.</p>
